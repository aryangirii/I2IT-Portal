services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: placement
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - placement_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement -d placement"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  placement_db:
